<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>GhostWolf - Activation</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body, html {
      height: 100%;
      margin: 0;
      background: rgba(20, 20, 20, 0.95);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
    }
    .container {
      background: rgba(30, 30, 30, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 30px;
      width: 400px;
      text-align: center;
      -webkit-app-region: no-drag;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 25px;
    }
    .field {
      text-align: left;
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .hwid-box {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      color: #ddd;
    }
    .hwid-box span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hwid-box button {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-left: 10px;
      transition: background 0.2s;
    }
    .hwid-box button:hover {
      background: rgba(255,255,255,0.2);
    }
    input[type="text"] {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #10b981;
    }
    .error {
      color: #ef4444;
      font-size: 13px;
      margin-top: 5px;
      display: none;
    }
    .btn-primary {
      background: #10b981;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      width: 100%;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-quit {
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      margin-top: 15px;
      text-decoration: underline;
    }
    .btn-quit:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Activate GhostWolf</h1>
    <p>Please enter your license key for this device.</p>

    <div class="field">
      <label>Device Signature</label>
      <div class="hwid-box">
        <span id="hwid-display">Loading...</span>
        <button id="copy-hwid-btn">Copy</button>
      </div>
    </div>

    <div class="field">
      <label>License Key</label>
      <input type="text" id="license-input" placeholder="Paste your license key here" spellcheck="false" autocomplete="off" />
      <div id="error-msg" class="error">Invalid license key for this device.</div>
    </div>

    <button id="activate-btn" class="btn-primary">Activate</button>
    <button id="quit-btn" class="btn-quit">Quit</button>
  </div>
  <script src="activation.js"></script>
</body>
</html>
